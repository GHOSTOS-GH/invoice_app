name: invoice_app
description: Application de gestion de factures moderne et élégante
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.2
  shared_preferences: ^2.2.2
  intl: ^0.20.2
  pdf: ^3.10.8
  printing: ^5.12.0
  share_plus: ^7.2.1
  path_provider: ^2.1.2
  image_picker: ^1.0.7
  fl_chart: ^0.66.0
  image: ^4.0.0
  file_picker: ^10.3.3
  esc_pos_utils_plus: ^2.0.4
  blue_thermal_printer: ^1.2.3
  qr_flutter: ^4.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.0

flutter:
  uses-material-design: true
  assets:
    - assets/icon/
    - assets/watermark/

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon/invoice_icon.png"
  min_sdk_android: 21